<style>
:root {
  --paper: #f4f1ea; --paper-3: #ebe7de; --ink: #16191d; --ink-2: #3b4148; --muted: #5f666e; --line: #d9d4c9;

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.frame { position: relative; overflow: hidden; display: none; }
.frame.on { display: block; }
.dark { background: var(--asfalt); color: var(--on-dark); }
.paper { background: var(--paper); }
svg { display: block; }
.d { font-family: var(--display); font-stretch: 108%; letter-spacing: -0.02em; }

/* Logo lockup: the N is a road with a yellow centre line */
.lockup { display: flex; align-items: center; gap: .32em; font-family: var(--display); font-weight: 640; font-stretch: 108%; letter-spacing: -0.012em; line-height: 1; }
.lockup svg { width: 1.05em; height: 1.05em; flex: none; }
.mk .road { fill: none; stroke: var(--road); stroke-width: 12.5; stroke-linejoin: round; }
.mk .cl { fill: none; stroke: var(--yellow); stroke-width: 2.2; stroke-dasharray: 4 3.6; stroke-dashoffset: 2; stroke-linejoin: round; }
.mk .plate { fill: var(--paper); }

/* Big road drawings */
.bigroad .edge { fill: none; stroke: var(--on-dark); stroke-linejoin: round; opacity: .85; }
.bigroad .surface { fill: none; stroke: var(--road-dark); stroke-linejoin: round; }
.bigroad .cl { fill: none; stroke: var(--yellow); stroke-linejoin: round; }

#launch .foot .lockup { font-size: 44px; }
#launch .url { font: 600 34px/1 var(--display); font-stretch: 105%; color: var(--yellow); letter-spacing: .01em; }

.tl .lbl.now b { color: var(--ink); }

/* ---------- offer 1080x1350 ---------- */

<script>
const T = {
  no: {

    tl: [["1988", "Statens vegvesen"], ["1993", "Vianova"], ["2015", "Trimble"], ["2026", "NovaCoach"]],

const f = q.get("f") || "launch", lang = q.get("lang") || "no", t = T[lang];

for (const el of document.querySelectorAll("[data-t]")) {

// Career timeline, drawn to scale like chainage along an alignment: 1988 at x0, 2026 at x1.
(function timeline() {
  const W = 1080, x0 = 92, x1 = 880, y = 120, h = 46, yr = v => x0 + (v - 1988) / (2026 - 1988) * (x1 - x0);
  const svg = `<svg width="${W}" height="250" viewBox="0 0 ${W} 250" style="position:absolute;inset:0">
    <path d="M ${x0 - 40} ${y} H ${W + 20}" stroke="#d9d4c9" stroke-width="${h + 8}" fill="none" stroke-linecap="round"/>
    <path d="M ${x0 - 40} ${y} H ${W + 20}" stroke="#1b1f24" stroke-width="${h}" fill="none" stroke-linecap="round"/>
    <path d="M ${x0 - 22} ${y} H ${W + 20}" stroke="#f0c43c" stroke-width="7" fill="none" stroke-dasharray="20 16"/>
    ${t.tl.map(([v], i) => {
      const x = yr(+v), up = i % 2 === 1;
      return `<path d="M ${x} ${up ? y - h / 2 - 26 : y - h / 2} V ${up ? y + h / 2 : y + h / 2 + 26}" stroke="#16191d" stroke-width="3"/>
              <circle cx="${x}" cy="${y}" r="9" fill="${i === 3 ? '#f0c43c' : '#f4f1ea'}" stroke="#16191d" stroke-width="3"/>`;
    }).join("")}
  </svg>`;
  const labels = t.tl.map(([v, s], i) => {
    const up = i % 2 === 1, x = yr(+v);
    return `<div class="lbl ${up ? "up" : "down"}${i === 3 ? " now" : ""}" style="left:${x - 2}px"><b>${v}</b>${s}</div>`;
  }).join("");
  document.getElementById("tl").innerHTML = svg + labels;
})();
</script>
</body>
</html>
