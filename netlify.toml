[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Brand kit for Patrick: reachable by link, kept out of search results
[[headers]]
  for = "/brand/*"
  [headers.values]
    X-Robots-Tag = "noindex"
